
name: Build Bhumi Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BhumiMobileAndroid_Source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          mkdir project
          unzip -q BhumiMobileAndroid_Source.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          ls "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bhumi-Shop-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
